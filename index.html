<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Scoping System</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: white;
    }

    #app iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      background: #f4f7fb;
      color: #123b65;
      z-index: 2;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #d8e5f5;
      border-top-color: #1769c2;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #f4f7fb;
      padding: 24px;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #fallback .card {
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px #123b6515;
    }

    #fallback h2 {
      color: #123b65;
      margin-bottom: 12px;
    }

    #fallback p {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    #fallback a {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 9px;
      background: #1769c2;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loading">
      <div class="spinner"></div>
      <strong>Loading Market Scoping System...</strong>
    </div>

    <iframe
      id="systemFrame"
      title="Market Scoping System"
      src="https://script.google.com/macros/s/AKfycbxd2Xw_B-M-3jt28kesZwb6Ue8iM2NXsTN6CHPPzBlUFnCGJsEcX6z8el0oeBXaD9VA/exec"
      allow="clipboard-read; clipboard-write"
      allowfullscreen>
    </iframe>
  </div>

  <div id="fallback">
    <div class="card">
      <h2>Unable to Embed Application</h2>
      <p>
        Maaaring hindi pinapayagan ng Google Apps Script ang pag-display
        ng application sa iframe. Buksan ang system nang direkta.
      </p>
      <a
        href="https://script.google.com/macros/s/AKfycbxd2Xw_B-M-3jt28kesZwb6Ue8iM2NXsTN6CHPPzBlUFnCGJsEcX6z8el0oeBXaD9VA/exec"
        target="_blank"
        rel="noopener noreferrer">
        Open Market Scoping System
      </a>
    </div>
  </div>

  <script>
    const frame = document.getElementById("systemFrame");
    const loading = document.getElementById("loading");
    const fallback = document.getElementById("fallback");

    // Hide loader when the iframe reports a load event.
    frame.addEventListener("load", () => {
      loading.style.display = "none";
    });

    // A load event does not guarantee the embedded app was allowed.
    // Browsers do not let this page inspect cross-origin iframe errors.
    // If embedding is blocked, the browser may show its own error.
  </script>
</body>
</html>
