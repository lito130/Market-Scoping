<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Scoping Form System</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2a52'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='28' font-weight='700' text-anchor='middle' fill='white'%3EMS%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e1a;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #loader {
      position: fixed; inset: 0; background: #0a0e1a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .mark {
      width: 72px; height: 72px; margin-bottom: 24px; border-radius: 18px;
      background: #1a56b0; color: #fff; display: grid; place-items: center;
      font: 700 28px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px;
    }
    .spinner {
      width: 44px; height: 44px; border: 4px solid rgba(59,130,246,0.2);
      border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: #94a3b8; margin-top: 18px; font-family: 'Segoe UI', sans-serif; font-size: 14px; letter-spacing: 0.5px; text-align: center; padding: 0 16px; }
    #loader p.err { color: #fca5a5; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="mark" aria-hidden="true">MS</div>
    <div class="spinner" id="spin"></div>
    <p id="loadMsg">Loading Market Scoping Form System&hellip;</p>
  </div>

  <!-- PALITAN ang link sa ibaba ng Web app URL mo (Deploy > Manage deployments > Web app URL, yung nagtatapos sa /exec) -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/PASTE_DEPLOYMENT_ID/exec"
    title="Market Scoping Form System"
    allowfullscreen
    allow="clipboard-write"
    >
  </iframe>

  <script>
    (function () {
      var loader = document.getElementById('loader');
      var frame = document.getElementById('appFrame');
      function hideLoader() { loader.classList.add('hidden'); }

      // Walang URL pa? Sabihin agad imbes na mag-load nang walang hanggan.
      if (frame.getAttribute('src').indexOf('PASTE_DEPLOYMENT_ID') !== -1) {
        document.getElementById('spin').style.display = 'none';
        var m = document.getElementById('loadMsg');
        m.className = 'err';
        m.textContent = 'Setup needed: palitan ang PASTE_DEPLOYMENT_ID sa index.html ng Web app URL ng Apps Script (nagtatapos sa /exec).';
        return;
      }

      frame.addEventListener('load', hideLoader);     // nag-load na ang app
      setTimeout(hideLoader, 20000);                  // fallback

      // Optional: pinapayagan ang app na mag-save ng session sa sessionStorage ng page na ito
      // (kailangan ng katumbas na code sa loob ng app para magamit).
      var KEYS = ['ms_session', 'ms_page'];
      var ALLOWED = /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/;
      window.addEventListener('message', function (e) {
        if (!ALLOWED.test(e.origin)) return;
        var d = e.data;
        if (!d || typeof d.msType !== 'string') return;
        try {
          if (d.msType === 'get') {
            e.source.postMessage({
              msType: 'state',
              session: sessionStorage.getItem('ms_session'),
              page: sessionStorage.getItem('ms_page')
            }, e.origin);
          } else if (d.msType === 'save' && KEYS.indexOf(d.key) > -1 && typeof d.value === 'string') {
            sessionStorage.setItem(d.key, d.value);
          } else if (d.msType === 'ready') {
            hideLoader();
          } else if (d.msType === 'clear') {
            KEYS.forEach(function (k) { sessionStorage.removeItem(k); });
          }
        } catch (err) {}
      });
    })();
  </script>
</body>
</html>
